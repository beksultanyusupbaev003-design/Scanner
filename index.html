<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIYRAS SCAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #14181A;
    --surface: #1D2325;
    --surface-2: #262D30;
    --line: #33393C;
    --amber: #F2A93B;
    --amber-dim: #8A6423;
    --teal: #4FD1C5;
    --text: #ECEEE9;
    --text-dim: #909A9D;
    --danger: #E4573D;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Space Grotesk', system-ui, sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 {
    font-size: 17px;
    letter-spacing: 0.01em;
    margin: 0;
    font-weight: 700;
  }
  header h1 span { color: var(--amber); }
  header .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* --- Scanner card --- */
  .scanner {
    position: relative;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    aspect-ratio: 3 / 4;
    border: 1px solid var(--line);
  }
  .scanner video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .scanner .frame {
    position: absolute;
    inset: 14% 12%;
    border: 2px solid rgba(242,169,59,0.85);
    border-radius: 14px;
    pointer-events: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .scanner .frame.hit {
    border-color: var(--teal);
    box-shadow: 0 0 0 4px rgba(79,209,197,0.18) inset;
  }
  .scanner .hint {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    font-family: var(--mono);
    pointer-events: none;
  }
  .scanner .idle {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    background: var(--surface);
  }
  .scanner .idle p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
    max-width: 26ch;
  }

  button {
    font-family: var(--sans);
    border: none;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--amber);
    color: #1A1300;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 12px;
    width: 100%;
  }
  .btn-primary:active { background: #d9922b; }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid var(--line);
    width: 100%;
  }
  .btn-secondary:active { background: #2d3437; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > * { flex: 1; }

  .status-msg {
    font-size: 13px;
    font-family: var(--mono);
    color: var(--danger);
    text-align: center;
  }

  /* --- Result card --- */
  .result {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    display: none;
    gap: 14px;
    flex-direction: column;
  }
  .result.show { display: flex; }
  .result .label {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .result .code {
    font-family: var(--mono);
    font-size: 14px;
    word-break: break-all;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px;
    border: 1px solid var(--line);
    line-height: 1.5;
  }
  .result .imgwrap {
    display: flex;
    justify-content: center;
    background: #fff;
    border-radius: 10px;
    padding: 14px;
  }
  .result .imgwrap canvas { image-rendering: pixelated; max-width: 100%; }

  /* --- History --- */
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .history-head h2 {
    font-size: 14px;
    margin: 0;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: none;
  }
  .history-head button {
    background: none;
    color: var(--danger);
    font-size: 12px;
    font-family: var(--mono);
    padding: 4px;
  }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-empty {
    color: var(--text-dim);
    font-size: 13px;
    padding: 18px 4px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }
  .hist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .hist-item .code {
    flex: 1;
    font-family: var(--mono);
    font-size: 12.5px;
    word-break: break-all;
    color: var(--text);
  }
  .hist-item .meta {
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .hist-item .del {
    background: none;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    padding: 4px 6px;
  }

  /* modal for viewing a history entry */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    width: 100%;
    padding: 18px 18px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 82vh;
    overflow-y: auto;
  }
  .modal .close {
    align-self: center;
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    padding: 0;
    margin-bottom: 4px;
  }

  ::selection { background: rgba(242,169,59,0.3); }
</style>
</head>
<body>

<header>
  <h1>MIYRAS <span>SCAN</span></h1>
  <div class="count" id="histCount">0 ta yozuv</div>
</header>

<main>

  <div class="scanner" id="scannerCard">
    <video id="video" playsinline muted></video>
    <div class="frame" id="frame" style="display:none;"></div>
    <div class="hint" id="hint" style="display:none;">Kodni ramka ichiga tuting</div>
    <div class="idle" id="idleState">
      <p>Kamera orqali mahsulot ustidagi DataMatrix kodini skanerlash uchun ruxsat bering.</p>
      <button class="btn-primary" id="startBtn" style="width:auto; padding:12px 22px;">Kamerani ishga tushirish</button>
    </div>
  </div>

  <div id="statusMsg" class="status-msg" style="display:none;"></div>

  <div class="btn-row" id="scanControls" style="display:none;">
    <button class="btn-secondary" id="stopBtn">Kamerani ochirish</button>
    <button class="btn-primary" id="rescanBtn" style="display:none;">Yana skanerlash</button>
  </div>

  <div class="result" id="resultCard">
    <div>
      <div class="label">Skanerlangan kod</div>
      <div class="code" id="resultCode"></div>
    </div>
    <div class="imgwrap"><canvas id="resultCanvas"></canvas></div>
    <div class="btn-row">
      <button class="btn-secondary" id="copyBtn">Nusxalash</button>
      <button class="btn-secondary" id="saveBtn">Saqlash</button>
    </div>
  </div>

  <div class="history-head">
    <h2>Skanerlar tarixi</h2>
    <button id="clearHistBtn">Tarixni tozalash</button>
  </div>
  <div class="history-list" id="historyList"></div>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="close" id="modalClose" aria-label="Yopish"></button>
    <div>
      <div class="label" style="font-family:var(--mono); font-size:11px; color:var(--text-dim);" id="modalMeta"></div>
      <div class="code" id="modalCode" style="margin-top:8px;"></div>
    </div>
    <div class="imgwrap"><canvas id="modalCanvas"></canvas></div>
    <div class="btn-row">
      <button class="btn-secondary" id="modalCopyBtn">Nusxalash</button>
      <button class="btn-secondary" id="modalDelBtn">O'chirish</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bwip-js@4.1.1/dist/bwip-js-min.js"></script>
<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'miyras_scan_history_v1';
  var video = document.getElementById('video');
  var frame = document.getElementById('frame');
  var hint = document.getElementById('hint');
  var idleState = document.getElementById('idleState');
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');
  var rescanBtn = document.getElementById('rescanBtn');
  var scanControls = document.getElementById('scanControls');
  var statusMsg = document.getElementById('statusMsg');
  var resultCard = document.getElementById('resultCard');
  var resultCode = document.getElementById('resultCode');
  var resultCanvas = document.getElementById('resultCanvas');
  var copyBtn = document.getElementById('copyBtn');
  var saveBtn = document.getElementById('saveBtn');
  var historyList = document.getElementById('historyList');
  var histCount = document.getElementById('histCount');
  var clearHistBtn = document.getElementById('clearHistBtn');

  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalClose = document.getElementById('modalClose');
  var modalCode = document.getElementById('modalCode');
  var modalMeta = document.getElementById('modalMeta');
  var modalCanvas = document.getElementById('modalCanvas');
  var modalCopyBtn = document.getElementById('modalCopyBtn');
  var modalDelBtn = document.getElementById('modalDelBtn');

  var controls = null;
  var reader = null;
  var lastResult = null;
  var lastSaved = false;
  var activeModalId = null;

  function showStatus(msg){
    if(!msg){ statusMsg.style.display = 'none'; return; }
    statusMsg.textContent = msg;
    statusMsg.style.display = 'block';
  }

  function vibrate(ms){
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
  }

  function copyText(text){
    var done = function(ok){ showStatus(ok ? "Nusxalandi" : "Nusxalab bolmadi"); setTimeout(function(){ showStatus(''); }, 1400); };
    try {
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ fallbackCopy(text, done); });
    } catch(e){ fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    } catch(e){ done(false); }
  }

  function renderLabel(canvas, text){
    try {
      var off = document.createElement('canvas');
      bwipjs.toCanvas(off, {
        bcid: 'datamatrix',
        text: text,
        scale: 3,
        includetext: false,
        backgroundcolor: 'FFFFFF',
        padding: 0
      });

      var pad = 18;
      var textCol = 30;
      var dmSize = 260;
      var W = textCol + pad * 2 + dmSize;
      var H = dmSize + pad * 2;
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, textCol + pad, pad, dmSize, dmSize);

      var availableLen = H - pad * 2;
      var fontSize = Math.max(9, Math.min(15, Math.floor(availableLen / (Math.max(text.length, 1) * 0.62))));

      ctx.save();
      ctx.translate(pad + 12, H - pad);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = '#111111';
      ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(text, 0, 0);
      ctx.restore();

      return true;
    } catch(e){
      return false;
    }
  }

  /* ---------- storage ---------- */
  function loadHistory(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch(e){ return []; }
  }
  function saveHistory(list){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }
    catch(e){ return false; }
  }
  function addToHistory(code){
    var list = loadHistory();
    list.unshift({ id: String(Date.now()) + Math.random().toString(16).slice(2), code: code, ts: Date.now() });
    if (list.length > 300) list = list.slice(0, 300);
    saveHistory(list);
    renderHistory();
  }
  function deleteFromHistory(id){
    var list = loadHistory().filter(function(item){ return item.id !== id; });
    saveHistory(list);
    renderHistory();
  }

  function formatTs(ts){
    var d = new Date(ts);
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderHistory(){
    var list = loadHistory();
    histCount.textContent = list.length + ' ta yozuv';
    historyList.innerHTML = '';
    if (list.length === 0){
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = 'Hozircha skanerlar yoq. Birinchi kodni skanerlang.';
      historyList.appendChild(empty);
      return;
    }
    list.forEach(function(item){
      var row = document.createElement('div');
      row.className = 'hist-item';

      var codeWrap = document.createElement('div');
      codeWrap.style.flex = '1';
      codeWrap.style.cursor = 'pointer';
      var codeEl = document.createElement('div');
      codeEl.className = 'code';
      codeEl.textContent = item.code.length > 46 ? item.code.slice(0,46) + '…' : item.code;
      var metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = formatTs(item.ts);
      codeWrap.appendChild(codeEl);
      codeWrap.appendChild(metaEl);
      codeWrap.addEventListener('click', function(){ openModal(item); });

      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '\u00d7';
      delBtn.addEventListener('click', function(ev){
        ev.stopPropagation();
        deleteFromHistory(item.id);
      });

      row.appendChild(codeWrap);
      row.appendChild(delBtn);
      historyList.appendChild(row);
    });
  }

  function openModal(item){
    activeModalId = item.id;
    modalCode.textContent = item.code;
    modalMeta.textContent = formatTs(item.ts);
    renderLabel(modalCanvas, item.code);
    modalBackdrop.classList.add('show');
  }
  function closeModal(){
    modalBackdrop.classList.remove('show');
    activeModalId = null;
  }
  modalClose.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', function(e){ if (e.target === modalBackdrop) closeModal(); });
  modalCopyBtn.addEventListener('click', function(){ copyText(modalCode.textContent); });
  modalDelBtn.addEventListener('click', function(){
    if (activeModalId){ deleteFromHistory(activeModalId); }
    closeModal();
  });

  /* ---------- scanning ---------- */
  function getReader(){
    if (reader) return reader;
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.DATA_MATRIX]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    reader = new ZXing.BrowserMultiFormatReader(hints);
    return reader;
  }

  function onScanned(text){
    if (lastResult === text) return; // ignore immediate repeats while frame still visible
    lastResult = text;
    lastSaved = false;
    vibrate(80);
    frame.classList.add('hit');
    hint.textContent = 'Kod topildi';
    showResult(text);
    stopScanningLoop(true);
  }

  function showResult(text){
    resultCode.textContent = text;
    renderLabel(resultCanvas, text);
    resultCard.classList.add('show');
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function startCamera(){
    showStatus('');
    idleState.style.display = 'none';
    frame.style.display = 'block';
    frame.classList.remove('hit');
    hint.style.display = 'block';
    hint.textContent = 'Kodni ramka ichiga tuting';
    scanControls.style.display = 'flex';
    rescanBtn.style.display = 'none';
    resultCard.classList.remove('show');
    lastResult = null;

    var r = getReader();
    r.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } } },
      video,
      function(result, err, ctrls){
        controls = ctrls;
        if (result){ onScanned(result.getText()); }
      }
    ).catch(function(err){
      idleState.style.display = 'flex';
      frame.style.display = 'none';
      hint.style.display = 'none';
      scanControls.style.display = 'none';
      showStatus('Kameraga ruxsat berilmadi yoki topilmadi. Brauzer sozlamalarini tekshiring.');
    });
  }

  function stopScanningLoop(keepVideoVisible){
    try { if (controls) controls.stop(); } catch(e){}
    controls = null;
    if (!keepVideoVisible){
      hint.style.display = 'none';
    }
  }

  function stopCameraFully(){
    stopScanningLoop(false);
    try {
      var stream = video.srcObject;
      if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); }
      video.srcObject = null;
    } catch(e){}
    idleState.style.display = 'flex';
    frame.style.display = 'none';
    scanControls.style.display = 'none';
    resultCard.classList.remove('show');
    showStatus('');
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCameraFully);
  rescanBtn.addEventListener('click', function(){ startCamera(); });

  copyBtn.addEventListener('click', function(){ copyText(resultCode.textContent); });
  saveBtn.addEventListener('click', function(){
    if (lastSaved || !lastResult) return;
    addToHistory(lastResult);
    lastSaved = true;
    saveBtn.textContent = 'Saqlandi';
    rescanBtn.style.display = 'block';
    setTimeout(function(){ saveBtn.textContent = 'Saqlash'; }, 1600);
  });

  clearHistBtn.addEventListener('click', function(){
    if (loadHistory().length === 0) return;
    if (confirm('Butun tarix ochirilsinmi?')){
      saveHistory([]);
      renderHistory();
    }
  });

  renderHistory();
})();
</script>
</body>
</html>
